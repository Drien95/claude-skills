<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette __TITRE__</title>
<style>
body { margin: 0; background: #14171a; color: #e3e6e8; font: 13px "Segoe UI", system-ui, sans-serif; }
#hud { position: fixed; top: 8px; left: 10px; background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; line-height: 1.5; }
#hud button { margin: 0 2px 2px 0; }
canvas { display: block; }
</style>
<div id="hud"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const D = __DONNEES__;
// Source (x, y, z haut) -> three (x, z, -y) ; unités Source (humain = 72 u)
const C = (p) => new THREE.Vector3(p[0], p[2], -p[1]);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 1, 60000);
const murs = new THREE.Group(); scene.add(murs);
const hemi = new THREE.HemisphereLight(0xffffff, 0x222222, 0.7); scene.add(hemi);
const cle = new THREE.DirectionalLight(0xffffff, 0.9); cle.position.set(-1200, 1800, 900); scene.add(cle);
const accent = new THREE.PointLight(0xffffff, 0, 520, 2); // accent court : le coeur, pas toute la scene scene.add(accent);
const sol = new THREE.Mesh(new THREE.PlaneGeometry(40000, 40000), new THREE.MeshStandardMaterial({ color: 0x555555 }));
sol.rotation.x = -Math.PI / 2; sol.position.y = D.sol; scene.add(sol);
const humain = new THREE.Mesh(new THREE.CylinderGeometry(16, 16, 72, 12), new THREE.MeshStandardMaterial({ color: 0xd94b3a }));
humain.position.set(D.humain[0], D.sol + 36 + D.humain[2], -D.humain[1]); scene.add(humain);
const meshes = D.props.map((p) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(p.taille[0], p.taille[1], p.taille[2]), new THREE.MeshStandardMaterial({ color: 0x8a8a8a }));
  m.matrixAutoUpdate = false; m.matrix.set(...p.m); m.userData.couleur = p.couleur; murs.add(m); return m;
});
const hex = (h) => new THREE.Color(h);
const effets = (D.script || []).map((e) => {
  const g = e.forme === 'cylindre' ? new THREE.CylinderGeometry(e.taille[0] / 2, e.taille[1] / 2, e.taille[2], 24) : new THREE.BoxGeometry(e.taille[0], e.taille[2], e.taille[1]);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: e.couleur, transparent: true, opacity: 0.85, fog: false }));
  if (new THREE.Color(e.couleur).getHSL({}).l < 0.15) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({ color: 0x6a6e78, fog: false }))); // effet sombre : silhouette lisible dans la brume
  m.position.set(e.pos[0], e.pos[1] + e.taille[2] / 2, e.pos[2]); m.rotation.y = (e.lacet || 0) * Math.PI / 180; m.userData = e; m.visible = false; scene.add(m); return m;
});
let mode = 'gris', t = 0, vueCourante = 0, controls = null;
try { controls = new THREE.OrbitControls(camera, renderer.domElement); } catch (e) { controls = null; }
function intensite(t) {
  const c = D.courbe; if (!c.length) return 0;
  if (t <= c[0][0]) return c[0][1];
  for (let i = 1; i < c.length; i++) if (t <= c[i][0]) { const a = c[i - 1], b = c[i]; return a[1] + (b[1] - a[1]) * (t - a[0]) / (b[0] - a[0] || 1); }
  return c[c.length - 1][1];
}
function appliquer() {
  const rendu = mode === 'rendu';
  const dom = hex(D.palette.dominante || '#555555');
  const I = intensite(t) / 5;
  const b = (D.brumes || []).filter((x) => x[0] <= t).pop();
  const ciel = b ? hex(b[1]) : dom;
  scene.background = rendu ? ciel.clone().multiplyScalar(0.45 + 0.4 * I) : hex('#14171a');
  scene.fog = rendu ? new THREE.FogExp2(ciel.clone().multiplyScalar(0.5 + 0.4 * I).getHex(), D.brume * (1.4 - 0.7 * I)) : null;
  hemi.intensity = rendu ? 0.45 + 0.35 * I : 0.7;
  cle.color.set(rendu ? (D.palette.neutres[0] || '#cccccc') : '#ffffff');
  accent.intensity = rendu && D.palette.accent ? 1.2 * Math.min(I, 2) : 0;
  if (D.palette.accent) accent.color.set(D.palette.accent);
  accent.position.copy(C(D.accent_pos));
  effets.forEach((m) => { m.visible = rendu && t >= m.userData.debut && t <= m.userData.fin; });
  sol.material.color.set(rendu ? ciel.clone().multiplyScalar(0.7) : 0x555555);
  meshes.forEach((m) => { m.material.color.set(rendu ? (m.userData.couleur ? new THREE.Color(m.userData.couleur[0] / 255, m.userData.couleur[1] / 255, m.userData.couleur[2] / 255).lerp(ciel, 0.5) : ciel) : 0x8a8a8a); });
  hud();
}
function aller(i) {
  vueCourante = (i + D.vues.length) % D.vues.length; const v = D.vues[vueCourante];
  camera.position.copy(C(v.pos)); camera.fov = v.fov || 75; camera.updateProjectionMatrix(); camera.lookAt(C(v.vise));
  if (controls) { controls.target.copy(C(v.vise)); controls.update(); }
  hud();
}
function hud() {
  const v = D.vues[vueCourante] || { nom: '-' };
  const actifs = D.evenements.filter((e) => Math.abs(e.t - t) < 0.6).map((e) => e.nom).join(', ');
  document.getElementById('hud').innerHTML = '<b>' + D.titre + '</b> · vue ' + (vueCourante + 1) + '/' + D.vues.length + ' « ' + v.nom + ' »<br>' +
    '<button onclick="maquette.aller(' + (vueCourante - 1) + ')">◀</button><button onclick="maquette.aller(' + (vueCourante + 1) + ')">▶</button>' +
    '<button onclick="maquette.mode(mode===\'gris\'?\'rendu\':\'gris\')">mode : ' + mode + '</button>' +
    '<button onclick="maquette.jouer()">▶ séquence</button><br>t = ' + t.toFixed(1) + ' s · intensité ' + intensite(t).toFixed(1) + '/5' + (actifs ? ' · ' + actifs : '');
}
let lecture = null;
window.maquette = {
  vues: D.vues, aller, mode: (m) => { mode = m; appliquer(); }, temps: (x) => { t = x; appliquer(); },
  jouer: () => { if (lecture) { clearInterval(lecture); lecture = null; return; } t = 0; lecture = setInterval(() => { t += 0.1; if (t > D.duree) { clearInterval(lecture); lecture = null; } appliquer(); }, 100); },
  capture: () => { renderer.render(scene, camera); return renderer.domElement.toDataURL('image/png'); },
  pret: true,
};
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
(function boucle() { requestAnimationFrame(boucle); if (controls) controls.update(); renderer.render(scene, camera); })();
appliquer(); aller(0);
</script>
